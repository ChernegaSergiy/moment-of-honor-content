name: Generate feed

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
  schedule:
    # Re-generate periodically so expired stories drop out of feed.json
    # even when no content changes.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm run generate-feed

      - name: Commit updated feed.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Compare old and new feed, ignoring the generatedAt timestamp
          OLD_HASH=$(git show HEAD:feed.json 2>/dev/null | jq -c 'del(.generatedAt)' | sha256sum || echo "old")
          NEW_HASH=$(jq -c 'del(.generatedAt)' feed.json | sha256sum || echo "new")
          
          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "Content unchanged. Skipping commit."
            git checkout feed.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add feed.json
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: Regenerate feed.json"
          git push

      - name: Prepare static assets
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p public
          cp feed.json public/
          cp -r media public/ || true

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name moment-of-honor-feed
