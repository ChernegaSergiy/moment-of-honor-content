name: Generate feed

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
  schedule:
    # Re-generate periodically so expired stories drop out of feed.json
    # even when no content changes.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm run generate-feed

      - name: Commit updated feed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: Regenerate feed.json"
          git push
