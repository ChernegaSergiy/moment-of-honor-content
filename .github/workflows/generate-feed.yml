name: Generate feed

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'media/**'
      - 'feed.json'
  schedule:
    # Re-generate periodically so expired stories drop out of feed.json
    # even when no content changes.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm run generate-feed

      - name: Commit updated feed.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: Regenerate feed.json"
          git push

      - name: Prepare static assets
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir -p public
          cp feed.json public/
          cp -r media public/ || true

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name moment-of-honor-feed
