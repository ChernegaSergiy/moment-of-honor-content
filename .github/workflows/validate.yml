name: Validate content

on:
  pull_request:
    paths:
      - 'content/**'
      - 'schema/**'
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'schema/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run validate
